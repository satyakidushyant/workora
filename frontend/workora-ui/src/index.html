<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workora HRMS — Modern Workforce Management Platform</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Workora is an intelligent, unified HRMS SaaS platform empowering modern enterprises with streamlined employee management, payroll, attendance, and analytics.">
  <link rel="icon" type="image/png" href="workoraLogo.png">
  <link rel="apple-touch-icon" href="workoraLogo.png">

  <!-- Tailwind CSS CDN with Plugins -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Google Fonts: Plus Jakarta Sans, Inter, Manrope & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind Configuration with Workora Brand Palette & Full Responsive Breakpoint Matrix -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        screens: {
          'xs': '360px',
          'sm': '640px',
          'md': '768px',
          'tablet': '820px',
          'lg': '1024px',
          'xl': '1280px',
          '2xl': '1440px',
          '3xl': '1920px'
        },
        extend: {
          colors: {
            // Core Workora Brand Palette
            "workora-dark": "#063B39",
            "workora-primary": "#0E6E68",
            "workora-accent": "#3FA79B",
            "workora-light": "#DCEBE7",
            "workora-surface": "#F4F8F7",
            "workora-text": "#163331",
            "workora-muted": "#6B7F7C",

            // Semantic mappings
            "primary": "#0E6E68",
            "primary-dark": "#063B39",
            "accent": "#3FA79B",
            "light-surface": "#DCEBE7",
            "success": "#10B981",
            "warning": "#F59E0B",
            "error": "#EF4444",
            "info": "#0E6E68"
          },
          borderRadius: {
            "sm": "8px",
            "md": "12px",
            "lg": "16px",
            "xl": "20px",
            "2xl": "24px",
            "3xl": "32px",
            "full": "9999px"
          },
          boxShadow: {
            "sm": "0 2px 8px rgba(6, 59, 57, 0.04)",
            "md": "0 8px 24px -4px rgba(6, 59, 57, 0.08)",
            "lg": "0 16px 36px -6px rgba(6, 59, 57, 0.12)",
            "xl": "0 24px 48px -12px rgba(6, 59, 57, 0.16)",
            "teal": "0 10px 30px -5px rgba(14, 110, 104, 0.25)"
          },
          fontFamily: {
            "sans": ["Plus Jakarta Sans", "Inter", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
            "heading": ["Plus Jakarta Sans", "Manrope", "sans-serif"],
            "mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "monospace"]
          },
          maxWidth: {
            "8xl": "88rem",
            "9xl": "96rem",
            "ultra": "120rem"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-[#163331] antialiased font-sans selection:bg-[#DCEBE7] selection:text-[#063B39]">
  <app-root></app-root>
</body>
</html>
